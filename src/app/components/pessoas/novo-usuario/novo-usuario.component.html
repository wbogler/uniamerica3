<br><br>
<div class="container">
    <form>
        <!-- Name input -->
        <mdb-form-control class="mb-4">
          <input mdbInput type="text" id="form5Example1" class="form-control" [(ngModel)] = "nome" name="nome"/>
          <label mdbLabel class="form-label" for="form5Example1" >username</label>
        </mdb-form-control>
      
        <!-- Email input -->
        <mdb-form-control class="mb-4">
          <input mdbInput type="password" id="form5Example2" class="form-control" [(ngModel)] = "password" name="password"/>
          <label mdbLabel class="form-label" for="form5Example2" >password</label>
        </mdb-form-control>
      
        <!-- Checkbox -->
        <div class="form-check d-flex justify-content-center mb-4">
          <input
            mdbCheckbox
            class="form-check-input me-2"
            type="checkbox"
            value=""
            id="form5Example3"
            [checked]="false"
            [(ngModel)] = "isAdmin"
          />
          <label class="form-check-label" for="form5Example3">
            Eh um usuario?
          </label>
        </div>
      
        <!-- Submit button -->
        <button mdbRipple type="button" class="btn btn-primary btn-block mb-4" (click)="registrar()">
          Registrar
        </button>
      </form>
    
</div>
